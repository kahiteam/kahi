name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  COSIGN_YES: 'true'

jobs:
  goreleaser:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Key the module cache on both modules: without tools/go.sum a
          # cold runner recompiles goreleaser from source (~46s) every run.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Set Go version env
        run: echo "GOVERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"
      - name: Load release notes footer
        run: |
          {
            echo "KAHI_RELEASE_FOOTER<<KAHI_EOF"
            cat .goreleaser/release-footer.md
            echo "KAHI_EOF"
          } >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact, and kept equal to the goreleaser pinned in tools/go.mod so
          # a local `task` run and the release job use the same builder.
          # check-tool-parity.sh enforces the match.
          version: 'v2.19.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-26.04
    needs: goreleaser
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kahiteam/kahi
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Sign image by digest
        run: cosign sign --yes "ghcr.io/kahiteam/kahi@${{ steps.build.outputs.digest }}"
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/kahiteam/kahi
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate image SBOM
        run: syft "ghcr.io/kahiteam/kahi@${{ steps.build.outputs.digest }}" -o cyclonedx-json=/tmp/image-sbom.cdx.json
      - name: Attest image SBOM
        run: cosign attest --yes --type cyclonedx --predicate /tmp/image-sbom.cdx.json "ghcr.io/kahiteam/kahi@${{ steps.build.outputs.digest }}"

  verify-signatures:
    runs-on: ubuntu-26.04
    needs: [goreleaser, container]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
      ISSUER: https://token.actions.githubusercontent.com
      IMAGE: ghcr.io/kahiteam/kahi@${{ needs.container.outputs.digest }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Download draft release assets
        run: |
          mkdir -p /tmp/release-assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/release-assets
      - name: Verify blob signatures
        working-directory: /tmp/release-assets
        run: |
          shopt -s nullglob
          bundles=(*.sigstore.json)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::error::no .sigstore.json bundles found in draft release"
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            blob="${bundle%.sigstore.json}"
            if [ ! -f "$blob" ]; then
              echo "::error::missing blob for $bundle"
              exit 1
            fi
            echo "verifying $blob"
            cosign verify-blob \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              --bundle "$bundle" \
              "$blob"
          done
      - name: Verify container image signature
        run: |
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$IMAGE"
      - name: Verify container CycloneDX attestation
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$IMAGE"
      - name: Verify container SLSA provenance attestation
        run: |
          cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$IMAGE"
      - name: Promote draft release
        # Latest only for a full release that is the highest version: never
        # for a prerelease, nor for a patch on an older line such as 0.1.x
        # published after 0.2.x (#150).
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          latest=false
          if [[ "$TAG" != *-* ]]; then
            top="$( { gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --limit 200 --json tagName --jq '.[].tagName'; echo "$TAG"; } | sort -V | tail -n 1)"
            [[ "$top" == "$TAG" ]] && latest=true
          fi
          echo "Publishing $TAG with latest=$latest"
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest="$latest"
