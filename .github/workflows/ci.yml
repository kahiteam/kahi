name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled re-runs the suite so tiles regenerate when full-test-report is
    # added; the other types are the default pull_request activity set.
    types: [opened, synchronize, reopened, labeled]

# Runner OS labels are pinned to a release, not ubuntu-latest, which GitHub
# repoints to a new OS on its own schedule. Bumped by hand as a reviewable
# change; only LTS images exist, so the ladder is 24.04 -> 26.04.
permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      golang: ${{ steps.filter.outputs.golang }}
      features: ${{ steps.filter.outputs.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            golang:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              # CI runs these scripts and builds these tools, so a change to
              # either must run the jobs that use them.
              - 'scripts/**'
              - 'tools/go.mod'
              - 'tools/go.sum'
              # Workflow edits change the environment the suite runs in
              # (runner OS, tool versions), so they must run it.
              - '.github/workflows/**'
            features:
              - 'feature_list.json'
              - '.specify/templates/feature-list-schema.json'

  golang:
    needs: changes
    if: needs.changes.outputs.golang == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Key the module cache on both modules: without tools/go.sum a
          # cold runner recompiles goreleaser from source (~46s) every run.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.54.0'
      # gotestsum comes from tools/go.mod via `go tool`; only golangci-lint
      # needs installing, as a checksum-verified binary download.
      - name: Install pinned tools
        run: ./scripts/install-golangci-lint.sh
      - name: Tool parity
        run: ./scripts/check-tool-parity.sh
      - run: task fmt
        name: Format check
      - run: task vet
        name: Vet
      - run: task lint
        name: Lint
      - run: task test
        name: Unit tests
      - run: task coverage
        name: Coverage check
      - run: task build
        name: Build
      - name: Unit test check run
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const file = 'unit-results.xml';
            if (!fs.existsSync(file)) {
              core.warning('unit-results.xml not found, skipping check run');
              return;
            }
            const xml = fs.readFileSync(file, 'utf8');
            const tests = parseInt(xml.match(/tests="(\d+)"/)?.[1] || '0');
            const failures = parseInt(xml.match(/failures="(\d+)"/)?.[1] || '0');
            const errors = parseInt(xml.match(/errors="(\d+)"/)?.[1] || '0');
            const skipped = (xml.match(/<skipped/g) || []).length;
            const passed = tests - failures - errors - skipped;
            const time = xml.match(/time="([\d.]+)"/)?.[1] || '0';
            const conclusion = (failures > 0 || errors > 0) ? 'failure' : 'success';
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Unit Test Results',
              head_sha: sha,
              status: 'completed',
              conclusion,
              output: {
                title: `${passed} passed, ${failures} failed, ${skipped} skipped`,
                summary: [
                  `**${tests}** tests completed in **${time}s**`,
                  '',
                  '| Metric | Count |',
                  '| --- | --- |',
                  `| Passed | ${passed} |`,
                  `| Failed | ${failures} |`,
                  `| Skipped | ${skipped} |`,
                ].join('\n'),
              },
            });
      - name: Build unit test PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          # The full-test-report label switches the tile to the full per-test
          # table; absent, FULL_REPORT is empty and the compact tile is kept.
          FULL_REPORT: ${{ contains(github.event.pull_request.labels.*.name, 'full-test-report') && '-full' || '' }}
        run: |
          go run .github/scripts/build-test-comment.go \
            -junit unit-results.xml \
            -title "Unit test results" \
            -label "Unit" \
            $FULL_REPORT \
            -output pr-comment-unit.md
          {
            echo ""
            echo "[Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> pr-comment-unit.md
      - name: Post unit test sticky comment
        # Best-effort: dependabot / fork PRs run with a read-only token and
        # cannot post comments. Do not fail the build when posting is denied.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: unit-test-results
          path: pr-comment-unit.md
      - name: Test summary
        if: always()
        run: |
          {
            echo "## Unit Test Results"
            echo ""
            if [ ! -f unit-results.xml ]; then
              echo "> No results file found"
            else
              line=$(head -5 unit-results.xml | tr '\n' ' ')
              tests=$(echo "$line" | grep -oP 'tests="\K[0-9]+' | head -1)
              failures=$(echo "$line" | grep -oP 'failures="\K[0-9]+' | head -1)
              errors=$(echo "$line" | grep -oP 'errors="\K[0-9]+' | head -1)
              skipped=$(grep -c '<skipped' unit-results.xml 2>/dev/null) || true
              skipped=${skipped:-0}
              tests=${tests:-0}
              failures=${failures:-0}
              errors=${errors:-0}
              passed=$((tests - failures - errors - skipped))
              echo "| Metric | Count |"
              echo "| --- | --- |"
              echo "| Total | $tests |"
              echo "| Passed | $passed |"
              echo "| Failed | $failures |"
              echo "| Skipped | $skipped |"
            fi
            echo ""
            echo "## Coverage"
            echo ""
            if [ ! -f coverage.out ]; then
              echo "> No coverage data found"
            else
              total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}')
              echo "| Metric | Value |"
              echo "| --- | --- |"
              echo "| Coverage | $total |"
              echo "| Threshold | 85% |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f coverage.out ]; then
            echo "No coverage data, skipping status"
            exit 0
          fi
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          threshold=85
          state="success"
          if [ "$(echo "$total < $threshold" | bc -l)" -eq 1 ]; then
            state="failure"
          fi
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          gh api "/repos/${{ github.repository }}/statuses/${sha}" \
            -f state="$state" \
            -f description="${total}% (threshold: ${threshold}%)" \
            -f context="coverage"

  version-consistency:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Go version references agree with go.mod
        run: |
          GOMOD=$(awk '/^go [0-9]+\.[0-9]+\.[0-9]+$/ { print $2 }' go.mod)
          if [ -z "$GOMOD" ]; then
            echo "FAIL: go.mod has no patch-pinned go directive (expected 'go X.Y.Z')"
            exit 1
          fi
          echo "go.mod declares Go $GOMOD"
          ERRORS=0

          DOCKER=$(grep -oE 'golang:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)
          if [ "$DOCKER" != "$GOMOD" ]; then
            echo "FAIL: Dockerfile builder golang:$DOCKER does not match go.mod $GOMOD"
            ERRORS=$((ERRORS + 1))
          fi

          while IFS= read -r v; do
            if [ "$v" != "$GOMOD" ]; then
              echo "FAIL: README.md references Go $v, go.mod declares $GOMOD"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(grep -oE 'Go [0-9]+\.[0-9]+\.[0-9]+' README.md | awk '{ print $2 }')

          if grep -rnE '^[[:space:]]+go-version:' .github/workflows/; then
            echo "FAIL: workflows must use 'go-version-file: go.mod', not a pinned go-version"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo
            echo "Go version references have drifted. Dependabot updates the Dockerfile"
            echo "image on its own; go.mod and README must be aligned in the same PR."
            exit 1
          fi
          echo "All Go version references match $GOMOD."

  # Warning-only quality gate (#115): reports code the shipped binary cannot
  # reach. The script exits 0 on findings and 1 only if a check cannot run.
  # Deliberately not a need of `summary`, so it never blocks a merge.
  wiring:
    needs: changes
    if: needs.changes.outputs.golang == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Report unreachable code
        run: ./scripts/check-wiring.sh

  verified-by:
    needs: changes
    if: needs.changes.outputs.golang == 'true' || needs.changes.outputs.features == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Report passing entries without e2e proof
        run: ./scripts/check-verified-by.sh

  commit-standards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate commits
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          ERRORS=0
          while IFS= read -r sha; do
            MSG=$(git log --format='%s' -n 1 "$sha")
            if echo "$MSG" | grep -qE '^Merge '; then continue; fi
            if ! echo "$MSG" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'; then
              echo "FAIL [$sha]: Not conventional commit: $MSG"
              ERRORS=$((ERRORS + 1))
            fi
            if [ ${#MSG} -gt 72 ]; then
              echo "WARN [$sha]: Subject > 72 chars: $MSG"
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          if [ $ERRORS -gt 0 ]; then exit 1; fi

  summary:
    if: always()
    needs: [changes, golang, version-consistency, commit-standards]
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.golang.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.version-consistency.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.commit-standards.result }}" == "failure" ]]; then exit 1; fi
          echo "golang: ${{ needs.golang.result }}"
          echo "versions: ${{ needs.version-consistency.result }}"
          echo "commits: ${{ needs.commit-standards.result }}"
          echo "All checks passed."
