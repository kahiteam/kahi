name: Security

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  check-go-files:
    runs-on: ubuntu-26.04
    outputs:
      has-go: ${{ steps.check.outputs.has-go }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f go.mod ] && find . -name '*.go' -print -quit | grep -q .; then
            echo "has-go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-go=false" >> "$GITHUB_OUTPUT"
          fi

  codeql:
    needs: check-go-files
    if: needs.check-go-files.outputs.has-go == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Key the module cache on both modules: without tools/go.sum a
          # cold runner recompiles goreleaser from source (~46s) every run.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  govulncheck:
    needs: check-go-files
    if: needs.check-go-files.outputs.has-go == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Key the module cache on both modules: without tools/go.sum a
          # cold runner recompiles goreleaser from source (~46s) every run.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # govulncheck is pinned in tools/go.mod; `go tool` builds it on demand.
      - name: Run govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...
