version: 2
updates:
  # Go modules
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Tool dependencies, pinned in tools/go.mod and kept out of the main module.
  - package-ecosystem: 'gomod'
    directory: '/tools'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Docker. Daily: the golang base image is how a new Go release (often a
  # security fix) reaches this repo, and weekly checks lagged one by six days.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
