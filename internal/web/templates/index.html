<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kahi - Process Supervisor</title>
    <link rel="stylesheet" href="/ui/static/style.css">
    <link rel="icon" href="/ui/static/favicon.svg">
</head>
<body>
    <header>
        <h1>Kahi</h1>
        <div class="header-actions toolbar">
            <button type="button" class="btn btn-start" data-bulk="start" disabled>Start All</button>
            <button type="button" class="btn btn-stop" data-bulk="stop" disabled>Stop All</button>
            <button type="button" class="btn btn-restart" data-bulk="restart" disabled>Restart All</button>
        </div>
    </header>

    <noscript><p class="noscript">Actions require JavaScript.</p></noscript>

    <main>
        <table id="process-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Group</th>
                    <th>State</th>
                    <th>PID</th>
                    <th>Uptime</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="process-list">
                {{range .Processes}}
                <tr data-name="{{.Name}}">
                    <td class="col-name" data-label="Name">{{.Name}}</td>
                    <td class="col-group" data-label="Group">{{.Group}}</td>
                    <td class="col-state" data-label="State"><span class="state state-{{.StateLower}}">{{.State}}</span></td>
                    <td class="col-pid" data-label="PID">{{if gt .PID 0}}{{.PID}}{{else}}-{{end}}</td>
                    <td class="col-uptime" data-label="Uptime">{{.UptimeStr}}</td>
                    <td class="col-desc" data-label="Description">{{.Description}}</td>
                    <td class="col-actions" data-label="Actions">
                        <button type="button" class="btn btn-start btn-sm" data-name="{{.Name}}" data-action="start" disabled>Start</button>
                        <button type="button" class="btn btn-stop btn-sm" data-name="{{.Name}}" data-action="stop" disabled>Stop</button>
                        <button type="button" class="btn btn-restart btn-sm" data-name="{{.Name}}" data-action="restart" disabled>Restart</button>
                        <a href="/ui/log/{{pathEscape .Name}}/stdout" class="btn btn-log btn-sm">Tail Stdout</a>
                        <a href="/ui/log/{{pathEscape .Name}}/stderr" class="btn btn-log btn-sm">Tail Stderr</a>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </main>

    <footer>
        <span id="last-update">Last update: -</span>
    </footer>

    <script src="/ui/static/app.js"></script>
</body>
</html>
