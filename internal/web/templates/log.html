<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kahi - {{.Name}} {{.Stream}}</title>
    <link rel="stylesheet" href="/ui/static/style.css">
    <link rel="icon" href="/ui/static/favicon.svg">
</head>
<body class="log-page">
    <header>
        <h1><a href="/ui/">Kahi</a> &rsaquo; {{.Name}} &rsaquo; {{.Stream}}</h1>
        <div class="header-actions">
            <a href="/ui/log/{{pathEscape .Name}}/stdout" class="btn btn-log{{if eq .Stream "stdout"}} active{{end}}">stdout</a>
            <a href="/ui/log/{{pathEscape .Name}}/stderr" class="btn btn-log{{if eq .Stream "stderr"}} active{{end}}">stderr</a>
        </div>
    </header>

    <main id="log" data-name="{{.Name}}" data-stream="{{.Stream}}">
        <div id="log-viewer">
            <pre id="log-output"></pre>
        </div>
        <div id="log-status">
            <span id="connection-status">Connecting...</span>
        </div>
    </main>

    <script src="/ui/static/log.js"></script>
</body>
</html>
