; web serves the site
[program:web] ; note
environment=A="1",
  B="2" ; continuation comment
; the binary
command=/usr/bin/web
startsecs=10 ; ten seconds
serverurl=AUTO ; not for kahi
; end of web

; daemon settings
[supervisord]
loglevel=info ; quieter
; log file
logfile=/var/log/kahi.log

[group:svc]
; members

programs=web
; trailing comment at end of file
