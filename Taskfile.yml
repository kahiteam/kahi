# https://taskfile.dev

version: '3'

vars:
  # Pinned tool invocations. gotestsum/goreleaser/govulncheck come from
  # tools/go.mod; golangci-lint is a verified binary download because upstream
  # does not support tool directives. Never call these tools bare: a tool found
  # on PATH is whatever that machine happens to have, which is how a green
  # local run and a green CI run disagree.
  GOTESTSUM: go tool -modfile=tools/go.mod gotestsum
  GORELEASER: go tool -modfile=tools/go.mod goreleaser
  GOVULNCHECK: go tool -modfile=tools/go.mod govulncheck
  GOLANGCI: ./bin/golangci-lint
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  GO_VERSION:
    sh: go version | cut -d' ' -f3
  LDFLAGS: >-
    -s -w
    -X github.com/kahiteam/kahi/internal/version.Version={{.VERSION}}
    -X github.com/kahiteam/kahi/internal/version.Commit={{.COMMIT}}
    -X github.com/kahiteam/kahi/internal/version.Date={{.DATE}}
    -X github.com/kahiteam/kahi/internal/version.GoVersion={{.GO_VERSION}}

tasks:
  build:
    desc: Compile binary to ./bin/kahi
    cmds:
      - CGO_ENABLED=0 go build -ldflags '{{.LDFLAGS}}' -o ./bin/kahi ./cmd/kahi
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - ./bin/kahi

  test:
    desc: Run unit tests with race detector
    cmds:
      - '{{.GOTESTSUM}} --format testdox --junitfile unit-results.xml -- -race -count=1 ./...'

  lint:
    desc: Run golangci-lint at the pinned version
    cmds:
      - ./scripts/install-golangci-lint.sh
      - '{{.GOLANGCI}} run ./...'

  fmt:
    desc: Check formatting (exits non-zero if files need formatting)
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Files need formatting:"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  coverage:
    desc: Generate coverage report and fail if below 85%
    cmds:
      - '{{.GOTESTSUM}} --format testdox --junitfile unit-results.xml -- -race -count=1 -coverprofile=coverage.out ./...'
      - |
        total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
        echo "Total coverage: ${total}%"
        threshold=85
        if [ "$(echo "$total < $threshold" | bc -l)" -eq 1 ]; then
          echo "Coverage ${total}% is below threshold ${threshold}%"
          exit 1
        fi

  all:
    desc: Run fmt, vet, lint, test, build in sequence
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: build

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf ./bin

  test-integration:
    desc: Run integration tests
    cmds:
      - '{{.GOTESTSUM}} --format testdox --junitfile integration-results.xml -- -race -count=1 -tags=integration ./...'

  test-e2e:
    desc: Run end-to-end tests
    cmds:
      - '{{.GOTESTSUM}} --format testdox --junitfile e2e-results.xml -- -race -count=1 -timeout=15m -tags=e2e ./...'

  setup:
    desc: Install development tools at their pinned versions
    cmds:
      # gotestsum, goreleaser and govulncheck need no install step: `go tool`
      # builds them from tools/go.mod on first use and caches them.
      - ./scripts/install-golangci-lint.sh
      - task: tools-parity

  tools-parity:
    desc: Fail if any tool on PATH disagrees with its pinned version
    cmds:
      - ./scripts/check-tool-parity.sh

  snapshot:
    desc: Build a local release snapshot with the pinned goreleaser
    cmds:
      - '{{.GORELEASER}} release --snapshot --clean'

  vulncheck:
    desc: Run govulncheck at the pinned version
    cmds:
      - '{{.GOVULNCHECK}} ./...'
